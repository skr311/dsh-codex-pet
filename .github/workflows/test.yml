name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core tests
        run: node scripts/test-m2.js
      - name: Route tests
        run: node scripts/test-m2-routes.js
